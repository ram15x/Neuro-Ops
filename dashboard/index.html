<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NeuroOps</title>
<meta name="description" content="An engine that watches a server fleet, works out what is wrong, and fixes what its guardrails allow.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <svg class="mark" viewBox="0 0 44 44" aria-hidden="true"><path d="M3 24h9l4-12 7 22 5-16 3 6h10"/><circle cx="38" cy="8" r="3.2"/></svg>
    <div>
      <h1>NeuroOps</h1>
      <p class="source" id="source">Loading</p>
    </div>
  </div>
  <p class="lede" id="lede"></p>
  <div class="switches">
    <fieldset class="seg" id="scenarioSeg">
      <legend>Faults</legend>
      <button type="button" data-scenario="clean" aria-pressed="true">Clean</button>
      <button type="button" data-scenario="hard" aria-pressed="false">Hard</button>
    </fieldset>
    <fieldset class="seg" id="modeSeg">
      <legend>Engine</legend>
      <button type="button" data-mode="shadow" aria-pressed="true">Shadow</button>
      <button type="button" data-mode="approval" aria-pressed="false" hidden>Approval</button>
      <button type="button" data-mode="auto" aria-pressed="false">Auto</button>
    </fieldset>
    <button type="button" class="theme" id="theme" aria-label="Switch between light and dark">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2a8 8 0 1 0 8 8 6 6 0 0 1-8-8z"/></svg>
    </button>
  </div>
</header>

<section class="transport" aria-label="Playback">
  <button type="button" id="play" class="play" aria-label="Pause">
    <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path id="playIcon" d="M5 3h4v14H5zM11 3h4v14h-4z"/></svg>
  </button>
  <div class="hop" role="group" aria-label="Jump between incidents">
    <button type="button" id="prevInc">Previous incident</button>
    <button type="button" id="nextInc">Next incident</button>
  </div>
  <label class="speed">Speed
    <select id="speed">
      <option value="6">30 min per second</option>
      <option value="12" selected>1 hour per second</option>
      <option value="48">4 hours per second</option>
    </select>
  </label>
  <time id="clock" class="clock"></time>
  <label class="check" id="truthWrap"><input type="checkbox" id="truth"> Show injected faults</label>
</section>

<section class="kpis" id="kpis" aria-label="Summary so far"></section>

<div class="scrubwrap">
  <canvas id="scrub" tabindex="0" role="slider" aria-label="Position in the recording" aria-valuemin="0"></canvas>
</div>

<main class="board">
  <section class="lanes" id="lanes" aria-label="Fleet"></section>
  <aside class="rail">
    <section>
      <h2>Open now</h2>
      <div id="open" class="cards"></div>
    </section>
    <section>
      <h2>What the engine did</h2>
      <ol id="log" class="log"></ol>
    </section>
  </aside>
</main>

<footer class="foot">
  <ul class="legend" aria-label="Trace colours">
    <li><i class="sw cpu"></i>CPU %</li>
    <li><i class="sw mem"></i>Memory %</li>
    <li><i class="sw disk"></i>Disk %</li>
    <li><i class="sw net"></i>Traffic in</li>
    <li><i class="sw ghost"></i>Without healing</li>
    <li><i class="sw danger"></i>Danger line, 90%</li>
  </ul>
  <p id="footnote"></p>
</footer>

<div id="tip" class="tip" hidden></div>

<dialog id="login">
  <form method="dialog" id="loginForm">
    <h2>Sign in to change the engine</h2>
    <p>Changing the mode or answering an approval needs an operator account.</p>
    <label>Username <input name="username" autocomplete="username" required></label>
    <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
    <p class="err" id="loginErr" hidden></p>
    <div class="row">
      <button type="button" id="loginCancel" class="quiet">Cancel</button>
      <button type="submit">Sign in</button>
    </div>
  </form>
</dialog>

<dialog id="alertDlg" class="wide">
  <article>
    <h2 id="alertSubject"></h2>
    <pre id="alertText"></pre>
    <p id="alertNote"></p>
    <div class="row"><button type="button" id="alertClose">Close</button></div>
  </article>
</dialog>

<script src="app.js"></script>
</body>
</html>

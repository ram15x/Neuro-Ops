name: CI

on:
  push:
    branches: [main, v3-rebuild]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install ruff
      # real errors only (syntax, undefined names, unused imports) on the maintained code
      - run: ruff check --select E9,F backend/engine backend/detect backend/logs backend/sim backend/storage backend/api/engine.py backend/main.py eval tests

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt
      # tests use sqlite and in-memory redis, see tests/conftest.py
      - run: pytest -q --cov=backend --cov-report=term

  scorecard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt
      # reruns the detector comparison and fails if the default detector got worse
      - run: python -m eval.scorecard --check
      - uses: actions/upload-artifact@v4
        with:
          name: scorecard
          path: docs/scorecard.md

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t neuroops:ci .
      # boot the image without postgres or redis and wait for /ping
      - run: |
          docker run -d --name neuroops -p 8000:8000 \
            -e DB_URL=sqlite:////tmp/neuroops.db -e REDIS_FAKE=true neuroops:ci
          for i in $(seq 1 30); do
            curl -fs http://localhost:8000/ready && curl -fs http://localhost:8000/dashboard/ >/dev/null && exit 0
            sleep 2
          done
          docker logs neuroops
          exit 1

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      # nothing is applied, this only checks the files are well formed
      - run: terraform -chdir=infra/terraform fmt -check -recursive
        continue-on-error: true   # hand-written, formatting is advisory
      - run: terraform -chdir=infra/terraform init -backend=false
      - run: terraform -chdir=infra/terraform validate
